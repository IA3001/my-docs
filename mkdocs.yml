site_name: My Docs
site_description: 我的文档站点
site_author: Your Name
site_url: https://example.github.io/my-docs/

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - content.code.copy

nav:
  - 主页: index.md
  - 关于: about.md
  - 使用指南: guide.md
  - API 参考: api.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search:
      lang: zh
